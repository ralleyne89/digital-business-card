<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070807" />
    <title>Offline | Reggie Digital Card</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #070807;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #070807;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #101512;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1;
      }

      p {
        margin: 16px 0 0;
        color: rgba(248, 250, 252, 0.7);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 24px;
        border-radius: 8px;
        background: #8b5cf6;
        padding: 0 16px;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>
        Reggie Alleyne's card is cached, but this page needs a connection to
        refresh. Try again once you're back online.
      </p>
      <a href="/">Return to card</a>
    </main>
  </body>
</html>
